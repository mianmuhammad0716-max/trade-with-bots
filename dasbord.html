<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AutoTrade Demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <h1 id="welcomeMsg"></h1>
    <h2>Balance: $<span id="balance">0</span></h2>

    <div class="invest-box">
      <p>Send investment to (Demo only): <b>08746382876</b></p>
      <input type="number" id="investAmount" placeholder="Enter amount">
      <button id="investBtn">Invest</button>
    </div>

    <div class="bot-status">
      <p>Trading bot status: <span id="botStatus">Running...</span></p>
    </div>

    <canvas id="portfolioChart" width="400" height="200"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
